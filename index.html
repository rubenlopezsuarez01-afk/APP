<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planning de comidas</title>
  <meta name="description" content="Planifica tus comidas de la semana y genera la lista de la compra por supermercado.">
  <meta name="theme-color" content="#2f7d4f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>🥗 Planning de comidas</h1>
    <div id="week-nav" class="week-nav">
      <button id="week-prev" class="icon-btn" aria-label="Semana anterior">‹</button>
      <span id="week-label"></span>
      <button id="week-next" class="icon-btn" aria-label="Semana siguiente">›</button>
      <button id="week-today" class="btn small ghost">Hoy</button>
    </div>
  </header>

  <main id="main"></main>

  <nav class="tabs">
    <button class="tab" data-view="week"><span>📅</span>Semana</button>
    <button class="tab" data-view="list"><span>🛒</span>Compra <b id="list-badge" class="badge" hidden></b></button>
    <button class="tab" data-view="recipes"><span>📖</span>Recetas</button>
    <button class="tab" data-view="settings"><span>⚙️</span>Ajustes</button>
  </nav>

  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/logic.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
